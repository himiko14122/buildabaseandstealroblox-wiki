<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="600" fill="url(#bg-gradient)"/>
  
  <!-- Shield icon -->
  <path d="M600 100L800 180V300C800 420 700 500 600 520C500 500 400 420 400 300V180L600 100Z" 
        fill="url(#shield-gradient)" opacity="0.3"/>
  
  <!-- Game title placeholder -->
  <text x="600" y="350" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" 
        fill="#F1F5F9" text-anchor="middle">Build a Base and Steal</text>
  
  <!-- Subtitle -->
  <text x="600" y="400" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" 
        fill="#94A3B8" text-anchor="middle">Roll. Build. Protect. Steal.</text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="150" r="80" fill="#6366F1" opacity="0.1"/>
  <circle cx="1000" cy="450" r="120" fill="#F59E0B" opacity="0.1"/>
  <circle cx="1050" cy="100" r="60" fill="#8B5CF6" opacity="0.15"/>
</svg>